[package]
name = "vulkan_audio_studio"
version = "0.3.0"
edition = "2021"
authors = ["Shay Kadosh"]
description = "Linux Desktop System-Audio Vulkan Visualizer (PipeWire/PulseAudio Monitor + wgpu + MilkDrop)"
license = "MIT"
repository = "https://github.com/leumicard-code/Vulkan-Audio-Visualizer"
homepage = "https://github.com/leumicard-code/Vulkan-Audio-Visualizer"

[dependencies]
ab_glyph = "0.2"
anyhow = "1.0"
bytemuck = { version = "1.25", features = ["derive"] }
dirs = "5"
fltk = { version = "1.5.23", features = ["rwh06", "use-wayland"] }
fltk-theme = "0.7.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "tga"] }
libloading = "0.8"
pollster = "0.4"
raw-window-handle = "0.6"
rustfft = "6.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wgpu = { version = "30.0", features = ["glsl"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
